project:
  name: pharma-cv-pipeline
  environment: dev

storage:
  bucket_name: pharma-cv-dev
  region_name: us-east-1
  endpoint_url: http://minio:9000
  raw_prefix: raw/openfda/drug_event
  audit_prefix: ops/audit
  curated_prefix: curated
  gold_prefix: gold

databricks:
  submit_enabled: false
  run_name_prefix: pharma-cv
  execution_source: git
  git_url: https://github.com/logeshvar/openfda-faers-pharma-covigilance-reporting.git
  git_provider: gitHub
  git_branch: main
  python_file_base_path: src
  python_file_base_uri: s3://pharma-cv-dev/jobs/src
  spark_version: 14.3.x-scala2.12
  node_type_id: i3.xlarge
  num_workers: 1
  autotermination_minutes: 30
  instance_profile_arn:
  data_security_mode:
  single_user_name:

metadata:
  glue_database_name: pharma_cv_dev
  athena_results_s3_uri: s3://pharma-cv-dev/ops/athena-results/

openfda:
  base_url: https://api.fda.gov/drug/event.json
  date_field: receivedate
  page_size: 100
  max_pages_per_run: 200
  request_timeout_seconds: 60
  sleep_seconds_between_requests: 0.2

ingestion:
  source_name: openfda_drug_event
  schedule: "0 6 * * *"
  local_staging_dir: .tmp/openfda
  cleanup_staging_files: true
  source_lag_days: 120
  default_window_days: 1

dq:
  min_expected_records: 0
  required_raw_fields:
    - safetyreportid
    - safetyreportversion
    - receivedate

logging:
  level: INFO

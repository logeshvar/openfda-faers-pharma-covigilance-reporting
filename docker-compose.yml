x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: /opt/airflow:/opt/airflow/src
    CV_CONFIG_PATH: "${CV_CONFIG_PATH:-/opt/airflow/conf/dev.yaml}"
    AWS_DEFAULT_REGION: "${AWS_REGION:-us-east-1}"
    AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-minioadmin}"
    AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
    S3_BUCKET: "${S3_BUCKET:-pharma-cv-dev}"
    S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://minio:9000}"
    DATABRICKS_SECRET_ID: "${DATABRICKS_SECRET_ID:-}"
    DATABRICKS_HOST_SECRET_KEY: "${DATABRICKS_HOST_SECRET_KEY:-host}"
    DATABRICKS_TOKEN_SECRET_KEY: "${DATABRICKS_TOKEN_SECRET_KEY:-token}"
    DATABRICKS_PYTHON_FILE_BASE_URI_SECRET_KEY: "${DATABRICKS_PYTHON_FILE_BASE_URI_SECRET_KEY:-python_file_base_uri}"
    DATABRICKS_HOST: "${DATABRICKS_HOST:-}"
    DATABRICKS_TOKEN: "${DATABRICKS_TOKEN:-}"
    DATABRICKS_PYTHON_FILE_BASE_URI: "${DATABRICKS_PYTHON_FILE_BASE_URI:-}"
    OPENFDA_CLEANUP_STAGING_FILES: "${OPENFDA_CLEANUP_STAGING_FILES:-true}"
    OPENFDA_SOURCE_LAG_DAYS: "${OPENFDA_SOURCE_LAG_DAYS:-120}"
    OPENFDA_DEFAULT_WINDOW_DAYS: "${OPENFDA_DEFAULT_WINDOW_DAYS:-1}"
    AIRFLOW_ADMIN_USERNAME: "${AIRFLOW_ADMIN_USERNAME:-airflow}"
    AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:-airflow}"
    AIRFLOW_ADMIN_FIRSTNAME: "${AIRFLOW_ADMIN_FIRSTNAME:-Airflow}"
    AIRFLOW_ADMIN_LASTNAME: "${AIRFLOW_ADMIN_LASTNAME:-Admin}"
    AIRFLOW_ADMIN_EMAIL: "${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./src:/opt/airflow/src
    - ./conf:/opt/airflow/conf
    - ./tests:/opt/airflow/tests
    - ./.tmp:/opt/airflow/.tmp
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_started

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - >
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do sleep 1; done &&
        mc mb --ignore-existing local/"$${S3_BUCKET}" &&
        exit 0
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-pharma-cv-dev}"

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create
        --role Admin
        --username "$${AIRFLOW_ADMIN_USERNAME:-airflow}"
        --password "$${AIRFLOW_ADMIN_PASSWORD:-airflow}"
        --firstname "$${AIRFLOW_ADMIN_FIRSTNAME:-Airflow}"
        --lastname "$${AIRFLOW_ADMIN_LASTNAME:-Admin}"
        --email "$${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - exec airflow webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - exec airflow scheduler
    restart: unless-stopped

volumes:
  postgres-db-volume:
  minio-data:
